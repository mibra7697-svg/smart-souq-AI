name: Smart Souq CI/CD
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
      - name: Install
        run: pnpm install
      - name: Build Backend
        run: pnpm --filter backend build
      - name: Build Frontend
        run: pnpm --filter frontend build
